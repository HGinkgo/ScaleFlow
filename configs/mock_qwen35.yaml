project:
  name: ScaleFlow
  seed: 42

scheduler:
  policy: confidence_cascade
  confidence_threshold: 0.8
  model_order:
    - Qwen/Qwen3.5-0.8B
    - Qwen/Qwen3.5-2B
    - Qwen/Qwen3.5-4B
    - Qwen/Qwen3.5-9B

requests:
