    prompt: "What is 2 + 2?"
    metadata:
      difficulty: easy
  - request_id: medium
    prompt: "A store discounts an 80 yuan item by 25%. What is the final price?"
    metadata:
      difficulty: medium
  - request_id: hard
    prompt: "A number leaves remainder 2 when divided by 3 and remainder 3 when divided by 5. Find the smallest positive value."
    metadata:
      difficulty: hard

